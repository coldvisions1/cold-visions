<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09070d">
<title>COLD ViSiONS — links</title>
<style>
:root{--bg:#09070d;--panel:#100d16;--line:rgba(210,165,255,.2);--purple:#bd83f4;--muted:#a99db4}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:#f8f3fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 12%,#281637 0%,#100b18 38%,#08070b 78%);display:grid;place-items:center;padding:32px 18px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
main{width:min(520px,100%);position:relative}
.panel{position:relative;text-align:center;padding:42px 30px 30px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(160deg,rgba(28,19,37,.94),rgba(11,9,15,.96));box-shadow:0 25px 90px #0009,inset 0 1px #fff1;overflow:hidden}
.panel:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:#a653e51b;filter:blur(75px);top:-200px;left:50%;transform:translateX(-50%)}
.avatar-wrap{position:relative;width:132px;height:132px;margin:0 auto 23px;padding:5px;border-radius:50%;background:linear-gradient(140deg,#f0c8ff,#8d4ac2,#39224d);box-shadow:0 0 34px #b76df45a}
.avatar{display:block;width:100%;height:100%;object-fit:cover;object-position:center 35%;border-radius:50%;border:3px solid #100c16}
h1{position:relative;margin:0;font-size:clamp(38px,9vw,58px);font-weight:850;letter-spacing:-3px;line-height:1.04;text-shadow:0 0 28px #c07aff40}
h1 span{color:#c996f5}
.role{margin:13px 0 0;color:#c9a9e0;font-size:12px;letter-spacing:4px;text-transform:uppercase}
.links{display:grid;gap:12px;margin-top:34px}
.link{position:relative;display:flex;align-items:center;gap:16px;min-height:68px;padding:12px 17px;border:1px solid rgba(211,170,245,.18);border-radius:16px;background:linear-gradient(100deg,#ffffff0a,#ffffff03);color:#f7efff;text-decoration:none;text-align:left;transition:transform .22s,border-color .22s,background .22s,box-shadow .22s}
.link:hover{transform:translateY(-3px);border-color:#c58bf2a8;background:#b56be51a;box-shadow:0 9px 28px #9a50ce20}
.icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;background:#bd83f41a;color:#d9b3ff}
.icon svg{width:24px;height:24px;display:block;fill:currentColor}
.link-title{font-weight:700;font-size:15px}
.link-sub{margin-top:3px;color:var(--muted);font-size:12px}
.external{margin-left:auto;color:#9c85ac;font-size:20px}
footer{margin-top:27px;color:#786c81;font-size:10px;letter-spacing:3px}
@media(max-width:420px){.panel{padding:34px 19px 25px}.avatar-wrap{width:116px;height:116px}h1{letter-spacing:-2px}}
</style>
</head>
